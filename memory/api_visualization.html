<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo2 项目 API 调用可视化图表</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --orange: #d29922; --red: #f85149; --purple: #bc8cff;
    --teal: #39d353; --yellow: #e3b341; --pink: #f778ba;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
  h1 { text-align: center; padding: 32px 0 8px; font-size: 24px; color: var(--accent); letter-spacing: 1px; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 32px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── 统计卡片 ── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 36px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; text-align: center; transition: transform .15s;
  }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-card .num { font-size: 32px; font-weight: 700; }
  .stat-card .label { color: var(--muted); font-size: 12px; margin-top: 4px; }

  /* ── 饼图 ── */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 36px; }
  @media(max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-box h2 { font-size: 15px; color: var(--accent); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

  /* SVG 饼图 */
  svg.pie { display: block; margin: 0 auto; overflow: visible; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* 横向条形图 */
  .bar-chart { width: 100%; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bar-label { width: 130px; text-align: right; font-size: 12px; color: var(--muted); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: #21262d; border-radius: 4px; height: 20px; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: #fff; transition: width .6s; }
  .bar-count { width: 28px; text-align: right; font-size: 12px; font-weight: 700; }

  /* ── 模块依赖矩阵 ── */
  .matrix-wrap { overflow-x: auto; margin-bottom: 36px; }
  .matrix-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .matrix-box h2 { font-size: 15px; color: var(--accent); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  table.matrix { border-collapse: collapse; font-size: 11px; min-width: 700px; }
  table.matrix th, table.matrix td { border: 1px solid #21262d; padding: 6px 8px; text-align: center; white-space: nowrap; }
  table.matrix th { background: #21262d; color: var(--muted); }
  table.matrix td.has { background: #1f6feb44; color: var(--accent); font-weight: 700; }
  table.matrix td.no { color: #30363d; }
  table.matrix td.row-label { text-align: left; font-weight: 600; color: var(--text); padding-left: 12px; }

  /* ── API 详情表 ── */
  .table-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 36px; }
  .table-box h2 { font-size: 15px; color: var(--accent); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-btn {
    padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-size: 12px; transition: all .15s;
  }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  input.search-box {
    background: #21262d; border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 6px 12px; font-size: 13px; width: 240px; outline: none;
  }
  input.search-box:focus { border-color: var(--accent); }
  table.api-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.api-table thead tr { background: #21262d; }
  table.api-table th { padding: 8px 10px; text-align: left; color: var(--muted); font-weight: 600; white-space: nowrap; }
  table.api-table tbody tr { border-bottom: 1px solid #21262d; transition: background .1s; }
  table.api-table tbody tr:hover { background: #1c2128; }
  table.api-table td { padding: 7px 10px; vertical-align: top; }
  table.api-table td:nth-child(3) { font-family: 'Consolas', monospace; color: #79c0ff; }
  table.api-table td:nth-child(4) { color: var(--muted); font-size: 11px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .count-badge { display: inline-block; background: #1f6feb; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }

  /* 数据流图 */
  .flow-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 36px; overflow-x: auto; }
  .flow-box h2 { font-size: 15px; color: var(--accent); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  svg.flow { display: block; min-width: 800px; }

  /* 隐藏行 */
  .hidden { display: none !important; }

  /* ── 参数展开面板 ── */
  table.api-table tbody tr.api-main { cursor: pointer; }
  table.api-table tbody tr.api-main:hover td:nth-child(3)::after {
    content: ' ▶'; color: var(--accent); font-size: 10px;
  }
  table.api-table tbody tr.api-main.expanded td:nth-child(3)::after {
    content: ' ▼'; color: var(--accent); font-size: 10px;
  }
  tr.param-row td { padding: 0 !important; background: #0d1117; border-bottom: 2px solid var(--border) !important; }
  .param-panel { padding: 12px 20px 14px 36px; }
  .param-title { font-size: 11px; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }
  table.param-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.param-table th { padding: 5px 10px; background: #161b22; color: var(--muted); font-weight: 600; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.param-table td { padding: 5px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
  table.param-table td:nth-child(1) { color: var(--muted); font-size: 11px; width: 28px; text-align: center; }
  table.param-table td:nth-child(2) { font-family: 'Consolas', monospace; color: #79c0ff; width: 180px; }
  table.param-table td:nth-child(3) { color: #e3b341; width: 160px; font-family: 'Consolas', monospace; font-size: 11px; }
  table.param-table td:nth-child(4) { color: var(--text); }
  .ret-row td { background: #1a2332 !important; }
  .ret-row td:nth-child(2) { color: #3fb950 !important; }
  .no-params { color: var(--muted); font-style: italic; font-size: 12px; padding: 6px 0; }
</style>
</head>

// ═══════════════════════════════════════════
//  渲染饼图
// ═══════════════════════════════════════════
(function renderPie() {
  const total = Object.values(CATEGORIES).reduce((a,b)=>a+b,0);
  let startAngle = -Math.PI/2;
  const g = document.getElementById('pie-slices');
  const lg = document.getElementById('pie-legend');
  const R = 90;

  Object.entries(CATEGORIES).forEach(([cat, count]) => {
    const angle = (count/total)*2*Math.PI;
    const endAngle = startAngle + angle;
    const x1 = R*Math.cos(startAngle), y1 = R*Math.sin(startAngle);
    const x2 = R*Math.cos(endAngle),   y2 = R*Math.sin(endAngle);
    const large = angle > Math.PI ? 1 : 0;
    const color = CAT_COLORS[cat] || '#666';
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M0,0 L${x1},${y1} A${R},${R},0,${large},1,${x2},${y2} Z`);
    path.setAttribute('fill', color);
    path.setAttribute('stroke','#0d1117');
    path.setAttribute('stroke-width','2');
    path.style.cursor='pointer';
    path.addEventListener('mouseenter', function(){ this.setAttribute('opacity','0.8'); });
    path.addEventListener('mouseleave', function(){ this.setAttribute('opacity','1'); });
    const midAngle = startAngle + angle/2;
    const lx = (R*0.65)*Math.cos(midAngle), ly = (R*0.65)*Math.sin(midAngle);
    if(angle > 0.25) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',lx); txt.setAttribute('y',ly);
      txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','middle');
      txt.setAttribute('fill','#fff'); txt.setAttribute('font-size','11');
      txt.setAttribute('font-weight','700'); txt.textContent = count;
      g.appendChild(txt);
    }
    g.insertBefore(path, g.firstChild);
    startAngle = endAngle;

    // legend item
    const li = document.createElement('div'); li.className='legend-item';
    li.innerHTML = `<span class="legend-dot" style="background:${color}"></span><span>${cat} (${count})</span>`;
    lg.appendChild(li);
  });
})();

(function renderBar() {
  const max = Math.max(...Object.values(CATEGORIES));
  const bc = document.getElementById('bar-chart');
  Object.entries(CATEGORIES).sort((a,b)=>b[1]-a[1]).forEach(([cat,count])=>{
    const pct = Math.round(count/max*100);
    const color = CAT_COLORS[cat]||'#666';
    bc.innerHTML += `<div class="bar-row">
      <div class="bar-label">${cat}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${color}">${pct >= 20 ? count : ''}</div>
      </div>
      <div class="bar-count" style="color:${color}">${count}</div>
    </div>`;
  });
})();

// ═══════════════════════════════════════════
//  渲染模块×类别矩阵
// ═══════════════════════════════════════════
(function renderMatrix() {
  const MODULES = ["bsp","audio","protocol","session","wake_word","ui","common"];
  const MODULE_LABELS = {bsp:"BSP硬件层",audio:"音频模块",protocol:"网络协议",session:"会话管理",wake_word:"唤醒词引擎",ui:"UI交互",common:"公共工具"};
  const CATS = Object.keys(CATEGORIES);
  const matrixData = {};
  MODULES.forEach(m => { matrixData[m]={}; CATS.forEach(c=>matrixData[m][c]=0); });
  APIS.forEach(([cat,,,, mod]) => { if(matrixData[mod]) matrixData[mod][cat]=(matrixData[mod][cat]||0)+1; });

  const t = document.getElementById('matrix-table');
  const head = `<thead><tr><th>模块↓ / 类别→</th>${CATS.map(c=>`<th style="color:${CAT_COLORS[c]||'#ccc'}">${c}</th>`).join('')}<th>合计</th></tr></thead>`;
  let body='<tbody>';
  MODULES.forEach(m=>{
    const total = CATS.reduce((s,c)=>s+(matrixData[m][c]||0),0);
    body+=`<tr><td class="row-label">${MODULE_LABELS[m]||m}</td>`;
    CATS.forEach(c=>{
      const v=matrixData[m][c]||0;
      body+=v?`<td class="has">${v}</td>`:`<td class="no">·</td>`;
    });
    body+=`<td style="font-weight:700;color:#c9d1d9">${total}</td></tr>`;
  });
  body+='</tbody>';
  t.innerHTML=head+body;
})();

// ═══════════════════════════════════════════
//  渲染数据流图
// ═══════════════════════════════════════════
(function renderFlow() {
  const nodes = [
    {id:'mic',   x:40,  y:140, w:80, h:40, label:'麦克风\nES8311',     color:'#1f4e79'},
    {id:'i2s',   x:160, y:140, w:80, h:40, label:'I2S RX\ni2s_channel_read', color:'#0e3553'},
    {id:'afe',   x:290, y:100, w:100,h:40, label:'AFE 前端\nafe->feed/fetch', color:'#3a1a6e'},
    {id:'mn',    x:290, y:180, w:100,h:40, label:'MultiNet\n->detect', color:'#3a1a6e'},
    {id:'enc',   x:440, y:100, w:100,h:40, label:'OPUS 编码\nencode_process', color:'#1a3a1a'},
    {id:'ws',    x:590, y:100, w:100,h:40, label:'WebSocket\nsend_bin', color:'#3a1a0e'},
    {id:'cloud', x:740, y:100, w:90, h:40, label:'云端 AI\nLLM/TTS',    color:'#3a2200'},
    {id:'wsrx',  x:590, y:200, w:100,h:40, label:'WebSocket\nrecv_bin',  color:'#3a1a0e'},
    {id:'dec',   x:440, y:200, w:100,h:40, label:'OPUS 解码\ndec_process', color:'#1a3a1a'},
    {id:'spk',   x:290, y:260, w:100,h:40, label:'I2S TX\ni2s_write',  color:'#0e3553'},
  ];

  const edges = [
    {from:'mic',to:'i2s',label:'PCM 16kHz'},
    {from:'i2s',to:'afe',label:'PCM帧'},
    {from:'afe',to:'mn', label:'降噪PCM'},
    {from:'afe',to:'enc',label:'PCM→编码'},
    {from:'enc',to:'ws', label:'OPUS帧'},
    {from:'ws', to:'cloud',label:'WS Binary'},
    {from:'cloud',to:'wsrx',label:'TTS OPUS'},
    {from:'wsrx',to:'dec',label:'OPUS'},
    {from:'dec',to:'spk',label:'PCM'},
  ];

  const gn = document.getElementById('flow-nodes');
  const ge = document.getElementById('flow-edges');

  const cx = n => n.x + n.w/2;
  const cy = n => n.y + n.h/2;
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id]=n);

  // 边
  edges.forEach(e=>{
    const s=nodeMap[e.from], t=nodeMap[e.to];
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', cx(s)); line.setAttribute('y1', cy(s));
    line.setAttribute('x2', cx(t)); line.setAttribute('y2', cy(t));
    line.setAttribute('stroke','#58a6ff'); line.setAttribute('stroke-width','1.5');
    line.setAttribute('marker-end','url(#arr)');
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',(cx(s)+cx(t))/2); txt.setAttribute('y',(cy(s)+cy(t))/2-6);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('fill','#8b949e');
    txt.setAttribute('font-size','10'); txt.textContent = e.label;
    ge.appendChild(line); ge.appendChild(txt);
  });

  // 节点
  nodes.forEach(n=>{
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',n.x); rect.setAttribute('y',n.y);
    rect.setAttribute('width',n.w); rect.setAttribute('height',n.h);
    rect.setAttribute('rx','6'); rect.setAttribute('fill',n.color);
    rect.setAttribute('stroke','#30363d'); rect.setAttribute('stroke-width','1');
    gn.appendChild(rect);
    const lines = n.label.split('\n');
    lines.forEach((ln,i)=>{
      const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',cx(n)); txt.setAttribute('y', n.y + (i===0?14:26));
      txt.setAttribute('text-anchor','middle'); txt.setAttribute('fill',i===0?'#c9d1d9':'#79c0ff');
      txt.setAttribute('font-size',i===0?'11':'9');
      if(i===0) txt.setAttribute('font-weight','600');
      txt.textContent=ln; gn.appendChild(txt);
    });
  });
})();

// ═══════════════════════════════════════════
//  渲染 API 表格（支持点击展开参数）
// ═══════════════════════════════════════════
const MOD_LABELS = {bsp:"BSP硬件层",audio:"音频模块",protocol:"网络协议",session:"会话管理",wake_word:"唤醒词引擎",ui:"UI交互",common:"公共工具"};

function buildParamPanel(fn) {
  const params = PARAMS[fn];
  if (!params || params.length === 0) {
    return `<div class="param-panel"><span class="no-params">该 API 无需参数或参数说明暂未收录</span></div>`;
  }
  const regular = params.filter(p => !p.n.startsWith('↩'));
  const ret     = params.find(p => p.n.startsWith('↩'));
  let rows = regular.map((p, i) =>
    `<tr><td>${i+1}</td><td>${p.n}</td><td>${p.t}</td><td>${p.d}</td></tr>`
  ).join('');
  const retRow = ret
    ? `<tr class="ret-row"><td>↩</td><td>${ret.n}</td><td>${ret.t}</td><td>${ret.d}</td></tr>`
    : '';
  return `<div class="param-panel">
    <div class="param-title">参数说明 · 点击行再次折叠</div>
    <table class="param-table">
      <thead><tr><th>#</th><th>参数名</th><th>类型</th><th>说明</th></tr></thead>
      <tbody>${rows}${retRow}</tbody>
    </table>
  </div>`;
}

function renderTable(filter='all', search='') {
  const tbody = document.getElementById('api-tbody');
  tbody.innerHTML='';
  let count=0;
  APIS.forEach(([cat, file, fn, desc, mod]) => {
    if(filter!=='all' && cat!==filter) return;
    const q = search.toLowerCase();
    if(q && !fn.toLowerCase().includes(q) && !file.toLowerCase().includes(q) && !desc.toLowerCase().includes(q)) return;
    count++;
    const color = CAT_COLORS[cat]||'#666';
    const hasParams = PARAMS[fn] && PARAMS[fn].length > 0;
    const hint = hasParams
      ? `<span style="color:#30363d;font-size:10px;margin-left:4px" title="点击展开参数说明">▶</span>`
      : '';

    // 主行
    const tr = document.createElement('tr');
    tr.className = 'api-main';
    tr.innerHTML=`
      <td><span class="tag" style="background:${color}22;color:${color};border:1px solid ${color}44">${cat}</span></td>
      <td style="color:#8b949e;font-size:11px">${file}</td>
      <td style="font-family:'Consolas',monospace;color:#79c0ff">${fn}${hint}</td>
      <td style="color:var(--muted);font-size:11px">${desc}</td>
      <td><span class="tag" style="background:#21262d;color:#8b949e">${MOD_LABELS[mod]||mod}</span></td>`;

    // 展开行
    const expandTr = document.createElement('tr');
    expandTr.className = 'param-row hidden';
    expandTr.innerHTML = `<td colspan="5">${buildParamPanel(fn)}</td>`;

    tr.addEventListener('click', () => {
      const open = !expandTr.classList.contains('hidden');
      expandTr.classList.toggle('hidden', open);
      tr.classList.toggle('expanded', !open);
      // 更新指示箭头
      const arrow = tr.querySelector('span[title]');
      if (arrow) arrow.textContent = open ? '▶' : '▼';
      if (arrow) arrow.style.color = open ? '#30363d' : 'var(--accent)';
    });

    tbody.appendChild(tr);
    tbody.appendChild(expandTr);
  });
  document.getElementById('visible-count').textContent=count;
}
renderTable();

// 筛选按钮
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', function(){
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    renderTable(this.dataset.cat, document.getElementById('search-input').value);
  });
});
document.getElementById('search-input').addEventListener('input', function(){
  const active = document.querySelector('.filter-btn.active');
  renderTable(active?active.dataset.cat:'all', this.value);
});
</script>
